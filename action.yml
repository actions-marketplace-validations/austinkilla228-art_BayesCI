name: BayesCI
description: Automated Bayesian ranking of commits after a failed GitHub Actions workflow
inputs:
  github-token:
    description: GitHub token with actions read and contents read
    required: true
  run-id:
    description: ID of the failed workflow run
    required: true
  failed-sha:
    description: SHA built in the failed workflow
    required: true
  branch:
    description: Branch of the failed workflow run
    required: true
  workflow-id:
    description: Workflow ID of the failed run
    required: true
  repository:
    description: Repository owner/name
    required: true
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Python dependency
      shell: bash
      run: python -m pip install PyYAML
    - name: Compile BayesCI C engine
      shell: bash
      run: make -C "$GITHUB_ACTION_PATH"
    - name: Analyze failed run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        BAYESCI_REPOSITORY: ${{ inputs.repository }}
        BAYESCI_WORKFLOW: ${{ inputs.workflow-id }}
        BAYESCI_BRANCH: ${{ inputs.branch }}
        BAYESCI_FAILED_SHA: ${{ inputs.failed-sha }}
        BAYESCI_RUN_ID: ${{ inputs.run-id }}
      run: python "$GITHUB_ACTION_PATH/action_runner.py"

branding:
  icon: 'activity'
  color: 'blue'
