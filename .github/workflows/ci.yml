name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Bayes engine
        run: |
          gcc -shared -fPIC -O2 -Iinclude \
            -o libbayes.so src/bayes.c -lm
      - name: Check Python syntax
        run: |
          python -m compileall -q .
